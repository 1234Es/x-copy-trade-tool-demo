<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>X Copy-Trade Tool -- Settings</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; background: #111827; color: #e5e7eb; padding: 20px; width: 360px; }
  label { display: block; font-size: 12px; color: #9ca3af; margin-top: 12px; }
  input { width: 100%; box-sizing: border-box; background: #1f2937; color: #e5e7eb; border: 1px solid #374151; border-radius: 6px; padding: 6px; margin-top: 4px; }
  button { margin-top: 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; }
  .status { margin-top: 10px; font-size: 12px; }
</style>
</head>
<body>
  <h3>X Copy-Trade Tool -- Settings</h3>
  <label>Local app base URL</label>
  <input id="baseUrl" placeholder="http://127.0.0.1:8000">
  <label>Webhook shared secret (must match WEBHOOK_SHARED_SECRET in the tool's .env)</label>
  <input id="webhookSecret" type="password">
  <button id="save">Save</button>
  <div class="status" id="status"></div>
  <script src="options.js"></script>
</body>
</html>
