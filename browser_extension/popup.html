<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>X Copy-Trade Tool</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; background: #111827; color: #e5e7eb; padding: 14px; width: 260px; }
  h4 { margin: 0 0 8px 0; }
  .row { display: flex; justify-content: space-between; margin-top: 6px; font-size: 13px; }
  .ok { color: #34d399; }
  .bad { color: #f87171; }
  button { margin-top: 12px; width: 100%; background: #374151; color: #e5e7eb; border: none; border-radius: 6px; padding: 6px; cursor: pointer; }
  p { font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>
  <h4>X Copy-Trade Tool</h4>
  <div id="result">Checking local app...</div>
  <p>Browse x.com/twitter.com and click the "→ Copy-Trade" button on any post to send it to your local tool for review.</p>
  <button id="open-options">Settings</button>
  <script src="popup.js"></script>
</body>
</html>
